name: safety-monitor

services:
  db:
    image: postgres:18
    container_name: safety-monitor-postgres
    environment:
      POSTGRES_DB: safety_monitor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      SAFETY_MONITOR_DB_PASSWORD: ${SAFETY_MONITOR_DB_PASSWORD:?Set SAFETY_MONITOR_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${SAFETY_MONITOR_DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "safety_monitor", "-d", "safety_monitor"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  postgres_data:
    name: safety_monitor_postgres_data
